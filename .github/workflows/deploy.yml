name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy source code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      - name: Prepare Laravel runtime directories
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment security files
        run: |
          printf '%s\n' 'Deny from all' > vendor/.htaccess
          find storage -type d -exec sh -c 'printf "%s\n" "Deny from all" > "$1/.htaccess"' _ {} \;
          find bootstrap/cache -type d -exec sh -c 'printf "%s\n" "Deny from all" > "$1/.htaccess"' _ {} \;

      - name: Deploy to Hostinger
        id: deploy_attempt_1
        continue-on-error: true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SCP_HOST }}
          username: ${{ secrets.SCP_USER }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          port: ${{ secrets.SCP_PORT }}
          target: /home/u685478147/public_html/public_html/notion_scan_business_card
          overwrite: true
          timeout: 60s
          command_timeout: 15m
          source: ".htaccess,app,artisan,bootstrap,composer.json,composer.lock,config,database,public,resources,routes,storage,vendor,vite.config.js"

      - name: Wait before Hostinger deploy retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Hostinger (retry 1)
        if: steps.deploy_attempt_1.outcome == 'failure'
        id: deploy_attempt_2
        continue-on-error: true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SCP_HOST }}
          username: ${{ secrets.SCP_USER }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          port: ${{ secrets.SCP_PORT }}
          target: /home/u685478147/public_html/public_html/notion_scan_business_card
          overwrite: true
          timeout: 60s
          command_timeout: 15m
          source: ".htaccess,app,artisan,bootstrap,composer.json,composer.lock,config,database,public,resources,routes,storage,vendor,vite.config.js"

      - name: Wait before final Hostinger deploy retry
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Hostinger (retry 2)
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SCP_HOST }}
          username: ${{ secrets.SCP_USER }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          port: ${{ secrets.SCP_PORT }}
          target: /home/u685478147/public_html/public_html/notion_scan_business_card
          overwrite: true
          timeout: 60s
          command_timeout: 15m
          source: ".htaccess,app,artisan,bootstrap,composer.json,composer.lock,config,database,public,resources,routes,storage,vendor,vite.config.js"

      - name: Smoke test deployed application
        env:
          BASE_URL: https://clb-biahoi.net/notion_scan_business_card
        run: |
          set -euo pipefail

          curl_options=(
            --silent
            --show-error
            --location
            --fail
            --retry 5
            --retry-delay 3
            --retry-all-errors
            --connect-timeout 10
            --max-time 30
          )

          login_page="$(mktemp)"
          trap 'rm -f "$login_page"' EXIT

          echo "Checking login page"
          curl "${curl_options[@]}" "$BASE_URL/login" --output "$login_page"
          grep -q '<h1>ログイン</h1>' "$login_page"

          mapfile -t asset_urls < <(
            grep -oE '(src|href)="[^"]*/build/assets/[^"]+"' "$login_page" |
              sed -E 's/^(src|href)="([^"]+)"$/\2/' |
              sort -u
          )

          if (( ${#asset_urls[@]} == 0 )); then
            echo "No Vite build assets were found in the login page" >&2
            exit 1
          fi

          for asset_url in "${asset_urls[@]}"; do
            echo "Checking Vite asset: $asset_url"
            curl "${curl_options[@]}" "$asset_url" --output /dev/null
          done

          for protected_path in .env composer.json composer.lock artisan vite.config.js; do
            status="$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --retry 5 --retry-delay 3 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                "$BASE_URL/$protected_path"
            )"
            echo "Checking protected path: $protected_path (HTTP $status)"
            if [[ "$status" != "403" && "$status" != "404" ]]; then
              echo "Protected path returned unexpected HTTP status: $protected_path ($status)" >&2
              exit 1
            fi
          done
